[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-black-box"
version = "0.1.0"
description = "Dual deployment evidence preservation and investigation platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "cryptography>=44", "argon2-cffi>=23", "httpx>=0.28,<1", "scikit-learn>=1.6,<2", "psutil>=6", "watchdog>=6", "yara-python>=4.5", "rfc8785>=0.1.4", "python-multipart>=0.0.20", "boto3>=1.35", "pyotp>=2.9", "psycopg[binary]>=3.2", "alembic>=1.14", "reportlab>=4,<5", "python-docx>=1.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
cbb = "cbb.cli:main"
cbb-agent = "cbb.agent:main"

[tool.setuptools.packages.find]
include = ["cbb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

